spring.application.name=demo

# 포트 설정
server.port=8080

# MySQL DB 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=JDBC:mysql://host.docker.internal:3306/board_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sql12345

# MyBatis 설정
mybatis.type-aliases-package=com.example.login_study.demo.entity
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
